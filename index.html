<body>
  <!-- 19.28.0: pierwszy element dla klawiatury — od razu do wyszukiwarki (przyciski mapy są w kodzie strony wcześniej). -->

  <!-- 19.28.0: ekran wczytywania zamiast pustej białej strony; React zastępuje go przy pierwszym renderze. -->
  <div id="root"><div class="boot-screen" role="status" aria-live="polite"><img src="./assets/mapownik-logo-icon.png?v=19.41.4" alt="" width="44" height="44" /><strong>msportal</strong><span>Wczytywanie mapy…</span></div></div>
  <script type="module">
    const root = document.getElementById('root');
    function showError(title, detail, options = {}) {
      if (!root) return;
      const box = document.createElement('div');
      box.style.cssText = 'font-family:Segoe UI,Arial,sans-serif;max-width:820px;margin:48px auto;padding:24px;border:1px solid #f3b4b4;border-radius:12px;background:#fff;color:#18202c';
      const heading = document.createElement('h2'); heading.style.marginTop = '0'; heading.textContent = String(title ?? 'Błąd'); box.appendChild(heading);
      const detailNode = document.createElement(options.preformatted ? 'pre' : 'p'); detailNode.textContent = String(detail ?? '');
      if (options.preformatted) detailNode.style.cssText = 'white-space:pre-wrap;background:#f7f7f8;padding:12px;border-radius:8px';
      box.appendChild(detailNode);
      if (options.actionHref && options.actionLabel) {
        const actionP = document.createElement('p'); const action = document.createElement('a');
        action.href = options.actionHref; action.textContent = options.actionLabel;
        action.style.cssText = 'display:inline-block;padding:10px 14px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none';
        actionP.appendChild(action); box.appendChild(actionP);
      }
      const diagP = document.createElement('p'); const diag = document.createElement('a'); diag.href = './diagnostyka.html'; diag.textContent = 'Otwórz diagnostykę'; diagP.appendChild(diag); box.appendChild(diagP);
      const version = document.createElement('p'); version.style.cssText = 'color:#667085;font-size:13px'; version.textContent = 'Wersja: 19.41.4'; box.appendChild(version);
      root.replaceChildren(box);
    }
    async function fetchVendorStatus(timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch('./api/vendor_status.php?v=19.41.4', { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error(`vendor_status: HTTP ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }
    // 17.8.11: vendor_status.php nie blokuje już każdego startu. Liczył SHA-256
    // ~5 MB bibliotek przy każdym otwarciu aplikacji, a start czekał na jego
    // odpowiedź, zanim zaczął pobierać OpenLayers. Teraz aplikacja startuje od
    // razu; o stan bibliotek pytamy dopiero wtedy, gdy start się nie powiódł —
    // tylko po to, żeby przy braku bibliotek przejść do setup-vendors.php.
    async function vendorsKnownMissing() {
      try {
        const status = await fetchVendorStatus(5000);
        return status && status.ready === false;
      } catch (error) {
        console.warn('msportal: vendor_status.php nie odpowiedział.', error);
        return false;
      }
    }
    function loadOpenLayers() {
      return new Promise((resolve, reject) => {
        if (window.ol?.Map) { resolve(); return; }
        const script = document.createElement('script');
        script.src = './vendor/static/openlayers.js?v=10.10.0';
        script.async = false;
        script.onload = () => (window.ol?.Map ? resolve() : reject(new Error('Lokalny OpenLayers nie udostępnił window.ol.Map.')));
        script.onerror = () => reject(new Error('Nie udało się załadować lokalnego OpenLayers.'));
        document.head.appendChild(script);
      });
    }
    try {
      // OpenLayers i graf modułów równolegle; vendor/ol-esm-2/_ol.js sam czeka
      // na window.ol (top-level await), więc kolejność wykonania jest ta sama.
      await Promise.all([loadOpenLayers(), import('./app-19.41.4/main.js?v=19.41.4')]);
    } catch (error) {
      console.error('msportal bootstrap failed', error);
      // 19.26.0: niepełne wgranie — nowy index.html, ale stary .htaccess blokuje nowy katalog
      // aplikacji (HTTP 410) albo katalogu nie ma (404). Komunikat mówi, co wgrać ponownie.
      let appStatus = 0;
      try { appStatus = (await fetch('./app-19.41.4/main.js?v=19.41.4', { method: 'HEAD', cache: 'no-store' })).status; } catch { appStatus = 0; }
      if (appStatus === 410 || appStatus === 404) {
        showError('Niepełna aktualizacja na serwerze',
          (appStatus === 410
            ? 'Serwer blokuje katalog app-19.41.4 (HTTP 410): wgrany jest nowy index.html, ale stary plik .htaccess.'
            : 'Na serwerze brakuje katalogu app-19.41.4 (HTTP 404).')
          + '\n\nWgraj ponownie całą paczkę tej wersji z opcją „nadpisz zawsze”: .htaccess (plik ukryty), VERSION.txt, katalog api/ oraz app-19.41.4/.'
          + ' Następnie otwórz verify-deployment.php — powinno być "deployment_consistent": true.',
          { preformatted: true, actionHref: './verify-deployment.php', actionLabel: 'Sprawdź wdrożenie (verify-deployment.php)' });
      } else if (await vendorsKnownMissing()) {
        window.location.replace('./setup-vendors.php?auto=1');
      } else {
        showError('msportal nie wystartował', String(error), {
          preformatted: true,
          actionHref: './setup-vendors.php?auto=1',
          actionLabel: 'Przygotuj biblioteki lokalne',
        });
      }
    }
  </script>
