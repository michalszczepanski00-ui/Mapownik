# msportal — wdrożenie na hosting przez FTP/SFTP (uruchamiane ręcznie: Actions → Wdrożenie → Run workflow).
#
# Wymagane sekrety w ustawieniach środowiska GitHub (Settings → Environments → test / produkcja):
#   DEPLOY_URL      np. sftp://ssh.cluster0XX.hosting.ovh.net  albo  ftp://ftp.cluster0XX.hosting.ovh.net
#   DEPLOY_USER     login FTP/SSH
#   DEPLOY_PASSWORD hasło
#   DEPLOY_DIR      katalog portalu na serwerze, np. www/test22
#   SITE_URL        adres portalu, np. https://mapownik.swiadectwa.net/test22
#
# Zasady (jak w README_WGRAJ_NA_SERWER.txt): pliki są nadpisywane, nic nie jest usuwane poza dawnymi
# katalogami app-<wersja>/ i bibliotekami sprzed 19.45.0 (lista w kroku 4) — dane (data/shared, data/rwdz, data/msportal) i cache/ zostają nietknięte,
# a starsze paczki assets/build/ zostają dla kart otwartych przed wdrożeniem.
name: Wdrożenie

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Środowisko'
        type: choice
        options: [test, produkcja]
        default: test

concurrency: deploy-${{ inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, gd, zip, pdo_sqlite, mbstring
          tools: none
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build && python3 tools/check_release.py
      - run: sudo apt-get install -y lftp
      - name: Wgranie plików
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION.txt)
          SETTINGS="set ssl:verify-certificate true; set ftp:ssl-allow true; set sftp:auto-confirm yes; set net:max-retries 3"
          # 1) wszystko poza index.html i .htaccess (nowe paczki muszą być na serwerze, zanim wskaże je index.html)
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; mirror --reverse --verbose --parallel=4 \
            --exclude-glob index.html --exclude-glob .htaccess build/www/ $DEPLOY_DIR/; bye"
          # 2) na końcu index.html i .htaccess
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; cd $DEPLOY_DIR; put build/www/.htaccess -o .htaccess; put build/www/index.html -o index.html; bye"
          # 3) 19.45.0: kod aplikacji jest tylko w assets/build/ — usuwamy wszystkie katalogi app-<wersja>/
          #    (dawne źródła, serwer i tak zwraca dla nich 410)
          for dir in $(lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; cls -1 $DEPLOY_DIR/; bye" | sed 's#.*/##; s#/$##' | grep -E '^app-[0-9]+\.[0-9]+\.[0-9]+$' || true); do
            echo "Usuwam dawny katalog $dir"
            lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; rm -r $DEPLOY_DIR/$dir; bye"
          done
          # 4) 19.45.0: dawne biblioteki i przygotowanie bibliotek (zastąpione paczką Vite); brak pliku nie jest błędem
          for old in vendor/static vendor/ol-esm vendor/ol-esm-2 vendor/opt vendor/shims vendor/geometry; do
            lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; rm -r $DEPLOY_DIR/$old; bye" 2>/dev/null && echo "Usunięto $old" || true
          done
          for old in setup-vendors.php api/vendor_status.php api/_vendor_builder.php; do
            lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; rm $DEPLOY_DIR/$old; bye" 2>/dev/null && echo "Usunięto $old" || true
          done
          # Arkusze warstw aplikacji (zostaje assets/css/monitor.css dla monitora źródeł)
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "$DEPLOY_URL" -e "$SETTINGS; cd $DEPLOY_DIR/assets/css; mrm [0-9][0-9]-*.css; bye" 2>/dev/null || true
      - name: Kontrola wdrożenia (tools/check_deploy.mjs)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          sleep 5
          node tools/check_deploy.mjs "$SITE_URL"
